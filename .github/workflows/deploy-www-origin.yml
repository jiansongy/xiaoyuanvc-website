name: Deploy www origin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-origin
  cancel-in-progress: false

jobs:
  sync-www:
    name: Sync www.xiaoyuanvc.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_INSTANCE_ID: ${{ secrets.ALIYUN_INSTANCE_ID }}
      ALIYUN_REGION_ID: ${{ vars.ALIYUN_REGION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"
          aliyun version

      - name: Configure Alibaba Cloud credentials
        run: |
          set -euo pipefail
          : "${ALIYUN_ACCESS_KEY_ID:?Missing secret ALIYUN_ACCESS_KEY_ID}"
          : "${ALIYUN_ACCESS_KEY_SECRET:?Missing secret ALIYUN_ACCESS_KEY_SECRET}"
          : "${ALIYUN_INSTANCE_ID:?Missing secret ALIYUN_INSTANCE_ID}"
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "$REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          for attempt in {1..4}; do
            if aliyun plugin install --names aliyun-cli-swas-open; then
              break
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "Plugin installation failed after 4 attempts" >&2
              exit 1
            fi
            echo "Retrying plugin installation ($attempt/3)..." >&2
            sleep 5
          done

      - name: Trigger www sync via Command Assistant
        id: run_command
        run: |
          set -euo pipefail
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          SYNC_SCRIPT_B64="$(gzip -c scripts/xyvc-sync.sh | base64 -w0)"
          COMMAND_CONTENT="$(cat <<EOF
          set -euo pipefail
          sync_script=\$(mktemp /tmp/xyvc-sync-command.XXXXXX)
          cleanup() {
            rm -f "\$sync_script"
          }
          trap cleanup EXIT
          printf '%s' "$SYNC_SCRIPT_B64" | base64 -d | gzip -d > "\$sync_script"
          bash -n "\$sync_script"
          XYVC_GITHUB_SHA="$GITHUB_SHA" XYVC_REPOSITORY="$GITHUB_REPOSITORY" bash "\$sync_script"
          EOF
          )"
          response="$(aliyun swas-open run-command \
            --region "$REGION" \
            --biz-region-id "$REGION" \
            --instance-id "$ALIYUN_INSTANCE_ID" \
            --name "xyvc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --type RunShellScript \
            --working-user root \
            --timeout 900 \
            --command-content "$COMMAND_CONTENT")"
          echo "$response"
          invoke_id="$(jq -r '.InvokeId // empty' <<<"$response")"
          if [[ -z "$invoke_id" ]]; then
            echo "RunCommand did not return InvokeId" >&2
            exit 1
          fi
          echo "invoke_id=$invoke_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Command Assistant result
        run: |
          set -euo pipefail
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          invoke_id="${{ steps.run_command.outputs.invoke_id }}"
          for _ in $(seq 1 90); do
            response="$(aliyun swas-open describe-invocation-result \
              --region "$REGION" \
              --biz-region-id "$REGION" \
              --instance-id "$ALIYUN_INSTANCE_ID" \
              --invoke-id "$invoke_id" || true)"
            status="$(jq -r '.InvocationResult.InvocationStatus // empty' <<<"$response")"
            record_status="$(jq -r '.InvocationResult.InvokeRecordStatus // empty' <<<"$response")"
            exit_code="$(jq -r '.InvocationResult.ExitCode // empty' <<<"$response")"
            output_b64="$(jq -r '.InvocationResult.Output // empty' <<<"$response")"

            if [[ -n "$output_b64" && "$output_b64" != "null" ]]; then
              printf '%s' "$output_b64" | base64 -d || true
              echo
            fi

            if [[ "$status" == "Success" && "$exit_code" == "0" ]]; then
              exit 0
            fi

            case "$status:$record_status" in
              Pending:*|Running:*|*:Running|"":"")
                sleep 10
                ;;
              *)
                echo "Command Assistant failed: status=$status record_status=$record_status exit_code=$exit_code" >&2
                echo "$response" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Command Assistant result" >&2
          exit 1

      - name: Verify public www pages
        run: |
          set -euo pipefail

          verify_page() {
            local url="$1"
            local marker="$2"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --noproxy '*' -sS --max-redirs 0 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]; then
              echo "Expected HTTP 200 for $url, got $status." >&2
              exit 1
            fi
            if grep -Fqi 'location:' "$headers"; then
              echo "Unexpected redirect for $url." >&2
              exit 1
            fi
            grep -Fqi 'server: nginx' "$headers"
            grep -Fq "$marker" "$body"
            rm -f "$body" "$headers"
          }

          verify_page "https://www.xiaoyuanvc.com/" "京ICP备2021017602号-1"
          verify_page "https://www.xiaoyuanvc.com/learn/crypto-vc/" "加密创投教程"
          verify_page "https://www.xiaoyuanvc.com/learn/digital-startup/" "数字创业教程"

          missing_url="https://www.xiaoyuanvc.com/deployment-smoke-missing-${GITHUB_SHA}"
          missing_status="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' "$missing_url")"
          if [[ "$missing_status" != "404" ]]; then
            echo "Expected HTTP 404 for $missing_url, got $missing_status." >&2
            exit 1
          fi
