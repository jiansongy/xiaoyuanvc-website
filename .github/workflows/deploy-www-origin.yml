name: Deploy www origin

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run on the www origin"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - renew-certificate
          - verify-delivery

permissions:
  contents: read
  actions: write

concurrency:
  group: www-origin
  cancel-in-progress: false

jobs:
  sync-www:
    name: Sync www.xiaoyuanvc.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_INSTANCE_ID: ${{ secrets.ALIYUN_INSTANCE_ID }}
      ALIYUN_REGION_ID: ${{ vars.ALIYUN_REGION_ID }}
      XYVC_OPERATION: ${{ inputs.operation || 'deploy' }}
      XYVC_RELAY_REGION: ap-southeast-7
      XYVC_RELAY_INSTANCE_ID: b93cae9c2edb4346acdb7c012ea863dd
      XYVC_RELAY_BASE_URL: https://approval.xiaoyuanvc.com/_xyvc-release
    steps:
      - uses: actions/checkout@v6

      - name: Test command submission recovery
        run: |
          python3 scripts/test-www-command-retry.py
          python3 scripts/test-www-deploy-guards.py
          python3 scripts/test-www-artifact.py
          python3 scripts/test-www-relay.py
          bash scripts/test-www-deployment.sh

      - uses: actions/setup-node@v6
        if: env.XYVC_OPERATION != 'renew-certificate'
        with:
          node-version: '22.23.1'

      - name: Build production pages on GitHub
        if: env.XYVC_OPERATION != 'renew-certificate'
        run: npm run build

      - uses: actions/setup-python@v6
        if: env.XYVC_OPERATION != 'renew-certificate'
        with:
          python-version: '3.12'

      - name: Package exact production release
        id: package
        if: env.XYVC_OPERATION != 'renew-certificate'
        run: python3 scripts/package-www-artifact.py

      - uses: actions/upload-artifact@v7
        id: upload
        if: env.XYVC_OPERATION != 'renew-certificate'
        with:
          name: www-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"
          aliyun version

      - name: Configure Alibaba Cloud credentials
        run: |
          set -euo pipefail
          : "${ALIYUN_ACCESS_KEY_ID:?Missing secret ALIYUN_ACCESS_KEY_ID}"
          : "${ALIYUN_ACCESS_KEY_SECRET:?Missing secret ALIYUN_ACCESS_KEY_SECRET}"
          : "${ALIYUN_INSTANCE_ID:?Missing secret ALIYUN_INSTANCE_ID}"
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "$REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          for attempt in {1..4}; do
            if aliyun plugin install --names aliyun-cli-swas-open; then
              break
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "Plugin installation failed after 4 attempts" >&2
              exit 1
            fi
            echo "Retrying plugin installation ($attempt/3)..." >&2
            sleep 5
          done

      - name: Stage release on Bangkok relay
        id: artifact
        if: env.XYVC_OPERATION != 'renew-certificate'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.sha256 }}
        run: python3 scripts/relay-www-artifact.py

      - name: Run selected www operation via Command Assistant
        id: run_command
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          validate_only=0
          [[ "$XYVC_OPERATION" != "verify-delivery" && "$GITHUB_REF" == "refs/heads/main" ]] || validate_only=1
          deploy_command() {
          cat <<EOF
          set -euo pipefail
          sync_script=\$(mktemp /tmp/xyvc-sync-command.XXXXXX)
          cleanup() {
            rm -f "\$sync_script"
          }
          trap cleanup EXIT
          printf '%s' "$SYNC_SCRIPT_B64" | base64 -d | gzip -d > "\$sync_script"
          bash -n "\$sync_script"
          XYVC_VALIDATE_ONLY="$validate_only" XYVC_GITHUB_SHA="$GITHUB_SHA" XYVC_ARTIFACT_URL="$ARTIFACT_URL" XYVC_ARTIFACT_SHA256="$ARTIFACT_SHA256" bash "\$sync_script"
          EOF
          }
          certificate_renewal_command() {
          cat <<'EOF'
          set -euo pipefail
          command -v certbot
          certbot renew --deploy-hook 'systemctl reload nginx'
          certbot certificates
          EOF
          }
          case "$XYVC_OPERATION" in
            deploy|verify-delivery)
              SYNC_SCRIPT_B64="$(gzip -c scripts/xyvc-sync.sh | base64 -w0)"
              COMMAND_CONTENT="$(deploy_command)"
              ;;
            renew-certificate)
              COMMAND_CONTENT="$(certificate_renewal_command)"
              ;;
            *)
              echo "Unsupported www operation: $XYVC_OPERATION" >&2
              exit 2
              ;;
          esac
          # A lost response may hide an accepted request. Serialize and remember
          # the result for this run/attempt before allowing submission retries.
          operation_b64="$(printf '%s' "$COMMAND_CONTENT" | base64 -w0)"
          COMMAND_CONTENT="$(cat <<EOF
          set -euo pipefail
          state_dir=/var/lib/xyvc-operations
          mkdir -p "\$state_dir"
          chmod 700 "\$state_dir"
          exec 9>"\$state_dir/operation.lock"
          flock -w 850 9
          result="\$state_dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.result"
          if [[ -f "\$result" ]]; then
            echo 'Operation already executed; returning stored result.'
            exit "\$(cat "\$result")"
          fi
          operation_status=0
          printf '%s' "$operation_b64" | base64 -d | bash || operation_status=\$?
          printf '%s\\n' "\$operation_status" > "\$result"
          exit "\$operation_status"
          EOF
          )"
          echo "::add-mask::$operation_b64"
          echo "::add-mask::$(printf '%s' "$COMMAND_CONTENT" | base64 -w0)"
          response="$(bash scripts/submit-www-command.sh \
            --region "$REGION" \
            --biz-region-id "$REGION" \
            --instance-id "$ALIYUN_INSTANCE_ID" \
            --name "xyvc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --type RunShellScript \
            --working-user root \
            --timeout 900 \
            --command-content "$COMMAND_CONTENT")"
          echo "$response"
          invoke_id="$(jq -r '.InvokeId // empty' <<<"$response")"
          if [[ -z "$invoke_id" ]]; then
            echo "RunCommand did not return InvokeId" >&2
            exit 1
          fi
          echo "invoke_id=$invoke_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Command Assistant result
        run: |
          set -euo pipefail
          REGION="${ALIYUN_REGION_ID:-cn-beijing}"
          invoke_id="${{ steps.run_command.outputs.invoke_id }}"
          for _ in $(seq 1 90); do
            response="$(aliyun swas-open describe-invocation-result \
              --region "$REGION" \
              --biz-region-id "$REGION" \
              --instance-id "$ALIYUN_INSTANCE_ID" \
              --invoke-id "$invoke_id" || true)"
            status="$(jq -r '.InvocationResult.InvocationStatus // empty' <<<"$response")"
            record_status="$(jq -r '.InvocationResult.InvokeRecordStatus // empty' <<<"$response")"
            exit_code="$(jq -r '.InvocationResult.ExitCode // empty' <<<"$response")"
            output_b64="$(jq -r '.InvocationResult.Output // empty' <<<"$response")"

            if [[ -n "$output_b64" && "$output_b64" != "null" ]]; then
              printf '%s' "$output_b64" | base64 -d || true
              echo
            fi

            if [[ "$status" == "Success" && "$exit_code" == "0" ]]; then
              exit 0
            fi

            case "$status:$record_status" in
              Pending:*|Running:*|*:Running|"":"")
                sleep 10
                ;;
              *)
                echo "Command Assistant failed: status=$status record_status=$record_status exit_code=$exit_code" >&2
                echo "$response" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Command Assistant result" >&2
          exit 1

      - name: Verify public www pages
        if: env.XYVC_OPERATION == 'deploy' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          verify_page() {
            local url="$1"
            local marker="$2"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -q --noproxy '*' -sS --connect-timeout 10 --max-time 20 --max-redirs 0 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]; then
              echo "Expected HTTP 200 for $url, got $status." >&2
              exit 1
            fi
            if grep -Fqi 'location:' "$headers"; then
              echo "Unexpected redirect for $url." >&2
              exit 1
            fi
            grep -Fqi 'server: nginx' "$headers"
            grep -Fq "$marker" "$body"
            rm -f "$body" "$headers"
          }

          verify_page "https://www.xiaoyuanvc.com/" "京ICP备2021017602号-1"
          verify_page "https://www.xiaoyuanvc.com/learn/crypto-vc/" "加密创投教程"
          verify_page "https://www.xiaoyuanvc.com/learn/digital-startup/" "数字创业教程"

          served_sha="$(curl -q --noproxy '*' -fsS --connect-timeout 10 --max-time 20 \
            "https://www.xiaoyuanvc.com/.well-known/deploy-sha.txt?sha=${GITHUB_SHA}")"
          [[ "$served_sha" == "$GITHUB_SHA" ]] || { echo "Public origin serves a different commit" >&2; exit 1; }

          # 下架资源重定向：非致命，仅告警，避免阻断内容部署
          for redirect_url in \
            "https://www.xiaoyuanvc.com/resources/ai-ready-check" \
            "https://www.xiaoyuanvc.com/resources/ai-employee-interview-guide" \
            "https://www.xiaoyuanvc.com/resources/china-hackathon-calendar"; do
            redirect_status="$(curl -q --noproxy '*' -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$redirect_url")"
            if [[ "$redirect_status" != "301" ]]; then
              echo "WARN: expected HTTP 301 for $redirect_url, got $redirect_status." >&2
            fi
          done

          missing_url="https://www.xiaoyuanvc.com/deployment-smoke-missing-${GITHUB_SHA}"
          missing_status="$(curl -q --noproxy '*' -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$missing_url")"
          if [[ "$missing_status" != "404" ]]; then
            echo "Expected HTTP 404 for $missing_url, got $missing_status." >&2
            exit 1
          fi

      - name: Remove temporary Bangkok release
        if: always() && steps.artifact.outcome == 'success'
        env:
          ARTIFACT_SHA256: ${{ steps.package.outputs.sha256 }}
        run: python3 scripts/relay-www-artifact.py --cleanup

      - name: Delete this run's temporary GitHub artifact
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
