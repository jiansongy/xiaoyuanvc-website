name: Deploy to GitHub Pages

# 主站已切换到 Cloudflare Pages（项目 xiaoyuanvc-website，自动部署 main 分支）。
# 此 workflow 保留为手动触发，仅作为应急回退到 GitHub Pages 的通道。
# 不要再开 push 触发，避免与 Cloudflare Pages 双写源站。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
