name: Check www origin

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-origin-check
  cancel-in-progress: true

jobs:
  check-www:
    name: Check www.xiaoyuanvc.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check DNS, HTTP, filing numbers, and certificate
        run: |
          set -euo pipefail

          expected_ip="39.106.61.204"
          dns_answered=0
          authoritative_servers=(ariadne.ns.cloudflare.com dante.ns.cloudflare.com)
          for nameserver in "${authoritative_servers[@]}"; do
            for attempt in 1 2; do
              ips="$(dig +time=3 +tries=1 +short www.xiaoyuanvc.com A @"$nameserver" 2>/dev/null \
                | grep -E '^[0-9]+(\.[0-9]+){3}$' || true)"
              if [[ -n "$ips" ]]; then
                dns_answered=1
                unexpected_ips="$(grep -Fvx "$expected_ip" <<<"$ips" || true)"
                if [[ -n "$unexpected_ips" ]]; then
                  echo "Unexpected www A record from $nameserver: $unexpected_ips" >&2
                  exit 1
                fi
                break
              fi
              echo "DNS lookup returned no valid A record from $nameserver (attempt $attempt/2)." >&2
            done
          done
          if (( dns_answered == 0 )); then
            echo "No authoritative DNS server returned a valid www A record." >&2
            exit 1
          fi

          verify_origin_page() {
            local url="$1"
            local marker="$2"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --noproxy '*' -sS --max-redirs 0 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]; then
              echo "Expected HTTP 200 for $url, got $status." >&2
              exit 1
            fi
            if grep -Fqi 'location:' "$headers"; then
              echo "Unexpected redirect for $url." >&2
              exit 1
            fi
            grep -Fqi 'server: nginx' "$headers"
            grep -Fq "$marker" "$body"
            rm -f "$body" "$headers"
          }

          verify_origin_page "https://www.xiaoyuanvc.com/" "京ICP备2021017602号-1"
          verify_origin_page "https://www.xiaoyuanvc.com/" "京公网安备11010802035175号"
          verify_origin_page "https://www.xiaoyuanvc.com/learn/crypto-vc/" "加密创投教程"
          verify_origin_page "https://www.xiaoyuanvc.com/learn/digital-startup/" "数字创业教程"

          cert_end="$(echo | openssl s_client -connect www.xiaoyuanvc.com:443 -servername www.xiaoyuanvc.com 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2-)"
          cert_end_epoch="$(date -u -d "$cert_end" +%s)"
          now_epoch="$(date -u +%s)"
          days_left="$(( (cert_end_epoch - now_epoch) / 86400 ))"
          echo "Certificate expires at: $cert_end ($days_left days left)"
          if (( days_left < 14 )); then
            echo "Certificate expires in less than 14 days" >&2
            exit 1
          fi
