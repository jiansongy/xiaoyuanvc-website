    <script src="resources.js"></script>
    <script>
      (function () {
        "use strict";

        var params = new URLSearchParams(window.location.search);
        var epNum = parseInt(params.get("ep"), 10);
        if (!epNum) {
          // No episode specified — load latest from episodes.json
          fetch("data/episodes.json")
            .then(function (res) {
              return res.json();
            })
            .then(function (data) {
              var episodes = data.episodes || data;
              if (episodes.length > 0) {
                var latest = episodes[0].ep;
                window.location.replace("episodes/ep" + latest + ".html");
              } else {
                document.getElementById("epTitle").textContent = "暂无节目";
              }
            })
            .catch(function () {
              document.getElementById("epTitle").textContent = "加载失败";
            });
          return;
        }

        // Redirect to static episode page for better SEO/GEO
        window.location.replace("episodes/ep" + epNum + ".html");

        fetch("data/episodes.json")
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            var episodes = data.episodes || data;
            var ep = null;
            var epIndex = -1;
            for (var i = 0; i < episodes.length; i++) {
              if (episodes[i].ep === epNum) {
                ep = episodes[i];
                epIndex = i;
                break;
              }
            }

            if (!ep) {
              document.getElementById("epTitle").textContent =
                "未找到 EP" + epNum;
              return;
            }

            // Populate page metadata
            document.getElementById("pageTitle").textContent =
              "EP" + ep.ep + ": " + ep.title + " | 校园VC 资源中心";
            document
              .getElementById("metaDesc")
              .setAttribute("content", ep.description || "");
            document
              .getElementById("ogTitle")
              .setAttribute("content", "EP" + ep.ep + ": " + ep.title);
            document
              .getElementById("ogDesc")
              .setAttribute("content", ep.description || "");
            document
              .getElementById("ogUrl")
              .setAttribute(
                "content",
                "https://xiaoyuanvc.com/resources/podcast.html?ep=" + ep.ep,
              );
            document
              .getElementById("canonicalLink")
              .setAttribute(
                "href",
                "https://xiaoyuanvc.com/resources/podcast.html?ep=" + ep.ep,
              );

            // Populate page content
            document.getElementById("breadcrumbTitle").textContent =
              "EP" + ep.ep;
            document.getElementById("epTitle").textContent =
              "EP" + ep.ep + ": " + ep.title;
            document.getElementById("epDate").textContent = ep.date;
            document.getElementById("epDuration").textContent = ep.duration;

            var guestEl = document.getElementById("epGuest");
            if (ep.guest) {
              guestEl.textContent = "嘉宾: " + ep.guest;
            } else {
              guestEl.style.display = "none";
            }

            var guestIntroEl = document.getElementById("epGuestIntro");
            if (ep.guestIntro) {
              guestIntroEl.textContent = ep.guestIntro;
            } else {
              guestIntroEl.style.display = "none";
            }

            document.getElementById("epDescription").textContent =
              ep.description || "";

            // Show Notes
            if (ep.showNotes) {
              var showNotesContent =
                document.getElementById("showNotesContent");
              showNotesContent.innerHTML = ep.showNotes;
              showNotesContent.className = "podcast-notes__content";
            }

            // JSON-LD structured data for SEO
            (function () {
              function durationToISO(dur) {
                var parts = dur.split(":").map(Number);
                if (parts.length === 3) {
                  return (
                    "PT" + parts[0] + "H" + parts[1] + "M" + parts[2] + "S"
                  );
                }
                return "PT" + parts[0] + "M" + parts[1] + "S";
              }

              var jsonLd = {
                "@context": "https://schema.org",
                "@type": "PodcastEpisode",
                name: "EP" + ep.ep + ": " + ep.title,
                description: ep.description || "",
                datePublished: ep.date,
                url:
                  "https://xiaoyuanvc.com/resources/podcast.html?ep=" + ep.ep,
                episodeNumber: ep.ep,
                partOfSeries: {
                  "@type": "PodcastSeries",
                  name: "CSS — 校园VC的创客频道",
                  url: "https://xiaoyuanvc.com/resources/",
                  author: {
                    "@type": "Organization",
                    name: "校园VC",
                    url: "https://xiaoyuanvc.com",
                  },
                },
              };

              if (ep.duration) {
                jsonLd.timeRequired = durationToISO(ep.duration);
              }

              if (ep.audioUrl) {
                jsonLd.associatedMedia = {
                  "@type": "AudioObject",
                  contentUrl: ep.audioUrl,
                };
              }

              if (ep.guest) {
                jsonLd.performer = {
                  "@type": "Person",
                  name: ep.guest,
                  description: ep.guestIntro || "",
                };
              }

              var script = document.createElement("script");
              script.type = "application/ld+json";
              script.textContent = JSON.stringify(jsonLd);
              document.head.appendChild(script);
            })();

            // External link
            if (ep.xiaoyuzhouUrl) {
              document.getElementById("xiaoyuzhouLink").href = ep.xiaoyuzhouUrl;
            }

            // Audio player
            var audio = document.getElementById("podcastAudio");
            var playBtn = document.getElementById("podcastPlayBtn");
            var bar = document.getElementById("podcastBar");
            var barFill = document.getElementById("podcastBarFill");
            var currentTimeEl = document.getElementById("podcastCurrentTime");
            var totalTimeEl = document.getElementById("podcastTotalTime");

            if (ep.audioUrl) {
              audio.src = ep.audioUrl;
            }

            function formatTime(s) {
              if (isNaN(s)) return "0:00";
              var h = Math.floor(s / 3600);
              var m = Math.floor((s % 3600) / 60);
              var sec = Math.floor(s % 60);
              if (h > 0) {
                return (
                  h +
                  ":" +
                  (m < 10 ? "0" : "") +
                  m +
                  ":" +
                  (sec < 10 ? "0" : "") +
                  sec
                );
              }
              return m + ":" + (sec < 10 ? "0" : "") + sec;
            }

            audio.addEventListener("loadedmetadata", function () {
              totalTimeEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener("timeupdate", function () {
              currentTimeEl.textContent = formatTime(audio.currentTime);
              var pct = audio.duration
                ? (audio.currentTime / audio.duration) * 100
                : 0;
              barFill.style.width = pct + "%";
            });

            var isPlaying = false;

            playBtn.addEventListener("click", function () {
              if (isPlaying) {
                audio.pause();
                playBtn.innerHTML =
                  '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
              } else {
                audio.play();
                playBtn.innerHTML =
                  '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
              }
              isPlaying = !isPlaying;
            });

            audio.addEventListener("ended", function () {
              isPlaying = false;
              playBtn.innerHTML =
                '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
            });

            bar.addEventListener("click", function (e) {
              if (!audio.duration) return;
              var rect = bar.getBoundingClientRect();
              var pct = (e.clientX - rect.left) / rect.width;
              audio.currentTime = pct * audio.duration;
            });

            // Prev/Next navigation
            // Episodes array is sorted newest-first (higher ep numbers first)
            var prevLink = document.getElementById("prevEp");
            var nextLink = document.getElementById("nextEp");

            if (epIndex > 0) {
              var newerEpisode = episodes[epIndex - 1];
              nextLink.href = "podcast.html?ep=" + newerEpisode.ep;
              nextLink.textContent = "EP" + newerEpisode.ep + " \u2192";
            } else {
              nextLink.style.display = "none";
            }

            if (epIndex < episodes.length - 1) {
              var olderEpisode = episodes[epIndex + 1];
              prevLink.href = "podcast.html?ep=" + olderEpisode.ep;
              prevLink.textContent = "\u2190 EP" + olderEpisode.ep;
            } else {
              prevLink.style.display = "none";
            }
          })
          .catch(function (err) {
            console.error("Failed to load episode:", err);
            document.getElementById("epTitle").textContent = "加载失败";
          });
      })();
    </script>
